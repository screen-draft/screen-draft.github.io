<section class="intro">
  <p>유족이 올린 안심상속 결과지를 읽어 원문과 나란히 확인하고, 확인된 항목으로 체크리스트·서비스 분야 안내·전문 파트너 상담까지 잇는 화면 시안입니다.</p>
  <p>문서, 인물(김○○), 기관(○○은행 등), 금액과 기한은 모두 예시이며 실제 문서 판독(OCR·AI)은 호출하지 않습니다.</p>
</section>
